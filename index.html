<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crazy Cards</title>
<style>
  :root { --cw: 84px; --r: #ff4f5e; --y: #ffc531; --g: #25c17a; --b: #3d82f6; --glow: #ffffff55; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: radial-gradient(1100px 700px at 50% 42%, #2a6170, #10262e 72%); color: #fff; font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         user-select: none; -webkit-user-select: none; touch-action: none; }
  #table { position: fixed; inset: 0; touch-action: none; }
  #opps { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 6px; padding: 0 8px; }
  .seat { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform .25s, opacity .25s; position: relative; }
  .seat.turn { transform: translateY(6px) scale(1.08); }
  .seat.out { opacity: .45; }
  .av { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #14161f; font-size: 18px;
        background: radial-gradient(closest-side, var(--c) 0 79%, #12303a 80% 87%, transparent 88%), conic-gradient(#fff calc(var(--t, 0) * 1turn), #ffffff1c 0); } /* the ring is the turn timer */
  .seat .nm { font-size: 12px; font-weight: 700; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .fan { position: relative; height: 40px; width: 70px; }
  .seat .fan .card { position: absolute; left: 50%; top: 2px; --cw: 24px; border-width: 1.5px; }
  .seat .cnt { position: absolute; top: 34px; right: 6px; background: #fff; color: #111; border-radius: 10px; font-size: 12px; font-weight: 800; padding: 1px 6px; z-index: 2; }
  .seat .one { position: absolute; top: -6px; left: -4px; background: var(--r); border-radius: 8px; font-size: 10px; font-weight: 800; padding: 1px 5px; z-index: 2; }
  #mid { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); display: flex; gap: calc(var(--cw) * .55); align-items: center; }
  #ring { position: absolute; left: 50%; top: 50%; width: calc(var(--cw) * 3.6); height: calc(var(--cw) * 3.6); margin: calc(var(--cw) * -1.8); border-radius: 50%;
          border: 3px dashed #ffffff26; animation: spin 14s linear infinite; pointer-events: none; }
  #ring.ccw { animation-direction: reverse; }
  #ring::after { content: "➤"; position: absolute; top: -13px; left: 50%; margin-left: -9px; font-size: 18px; color: #ffffff66; }
  #ring.ccw::after { transform: scaleX(-1); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #deck, #pile { position: relative; width: var(--cw); height: calc(var(--cw) * 1.45); }
  #deck .card, #pile .card { position: absolute; left: 0; top: 0; }
  #deck { cursor: pointer; } #deck.can .card:last-child { box-shadow: 0 0 0 3px #ffd166, 0 0 24px #ffd166aa; }
  #deck > span { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 700; opacity: .8; }
  #pile { border-radius: calc(var(--cw) * .14); box-shadow: 0 0 0 4px var(--glow), 0 0 36px var(--glow); transition: box-shadow .3s; }
  .card { width: var(--cw); height: calc(var(--cw) * 1.45); box-sizing: border-box; border-radius: calc(var(--cw) * .13); background: var(--cc); border: calc(var(--cw) * .055) solid #fff;
          box-shadow: 0 3px 8px #0007; display: grid; place-items: center; color: #fff; font-weight: 900; position: relative; overflow: hidden; }
  .card b { width: 78%; height: 64%; border-radius: 50%; background: #fff; transform: rotate(-28deg); display: grid; place-items: center; }
  .card b span { transform: rotate(28deg); color: var(--cc); font-size: calc(var(--cw) * .42); letter-spacing: -.04em; }
  .card i { position: absolute; font-style: normal; font-size: calc(var(--cw) * .2); top: 3%; left: 8%; }
  .card i + b + i { top: auto; left: auto; bottom: 3%; right: 8%; transform: rotate(180deg); }
  .c-r { --cc: var(--r); } .c-y { --cc: var(--y); } .c-g { --cc: var(--g); } .c-b { --cc: var(--b); } .c-w { --cc: #1d1c29; }
  .c-w b { background: conic-gradient(var(--r) 0 25%, var(--y) 0 50%, var(--g) 0 75%, var(--b) 0); }
  .c-w b span { color: #fff; text-shadow: 0 2px 4px #000c; }
  .back { --cc: #232136; } .back b { background: var(--r); } .back b span { color: var(--y); font-size: calc(var(--cw) * .2); font-style: italic; }
  #hand { position: absolute; left: 0; right: 0; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 20px); height: calc(var(--cw) * 1.45 + 26px); }
  #hand .card { position: absolute; bottom: 0; transition: transform .22s, left .22s, filter .2s, box-shadow .2s, opacity .2s; cursor: pointer; transform-origin: 50% 120%; }
  #hand .card.ok { box-shadow: 0 0 0 3px #ffd166, 0 8px 18px #000a; }
  #hand .card.dim { filter: brightness(.62) saturate(.7); }
  #me { position: absolute; left: 0; right: 0; bottom: calc(max(8px, env(safe-area-inset-bottom)) + var(--cw) * 1.45 + 54px); text-align: center; font-weight: 800; font-size: 18px; text-shadow: 0 2px 5px #000b; }
  #timer { width: 160px; height: 6px; margin: 6px auto 0; border-radius: 4px; background: #ffffff22; overflow: hidden; }
  #timer i { display: block; height: 100%; background: #ffd166; transform-origin: left; }
  #keep { position: absolute; left: 50%; top: calc(45% + var(--cw) * 1.05); transform: translateX(-50%); min-height: 44px; padding: 0 22px; border-radius: 22px; border: 0;
          background: #ffd166; color: #2a1d00; font: 800 15px system-ui, sans-serif; cursor: pointer; }
  #hint { position: absolute; left: 50%; top: calc(45% - var(--cw) * 1.35); transform: translateX(-50%); background: #0009; padding: 7px 14px; border-radius: 999px; font-size: 13px;
          white-space: nowrap; pointer-events: none; transition: opacity .5s; }
  #net { position: fixed; bottom: max(4px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .7; pointer-events: none; }
  #pick, #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0008; z-index: 30; }
  #pick div { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; border-radius: 20px; background: #13272e; }
  #pick button { width: 92px; height: 92px; border-radius: 18px; border: 4px solid #fff; cursor: pointer; }
  #pick[hidden], #over[hidden], #keep[hidden] { display: none; }
  .box { box-sizing: border-box; width: min(382px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #13272e; border: 1px solid #ffffff22; text-align: center; }
  .box h2 { margin: 0 0 4px; font-size: 26px; } .box p { margin: 0 0 12px; opacity: .8; }
  .box h3 { margin: 6px 0 4px; font-size: 13px; color: #ffd166; text-align: left; }
  .box ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 30px; } .box li span { float: right; }
  .box button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #ffd166; color: #2a1d00; font: 800 16px system-ui, sans-serif; cursor: pointer; }
  .fly { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; transition: transform .45s cubic-bezier(.2, .8, .25, 1); }
  .pop { position: fixed; z-index: 21; pointer-events: none; font-weight: 900; font-size: 34px; text-shadow: 0 3px 0 #0008; animation: pop 1.1s ease-out forwards; }
  @keyframes pop { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -120%) scale(1); opacity: 0; } }
  .shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 35; }
  .hide { display: none !important; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<div id="table">
  <div id="opps"></div>
  <div id="ring"></div>
  <div id="mid"><div id="deck"></div><div id="pile"></div></div>
  <div id="hint">Match the color or the number. No match? Tap the deck.</div>
  <button id="keep" hidden>Keep it</button>
  <div id="me"><span id="meText"></span><div id="timer"><i></i></div></div>
  <div id="hand"></div>
</div>
<canvas id="fx"></canvas>
<div id="net">Connecting…</div>
<div id="pick" hidden><div><button data-c="r" style="background:var(--r)"></button><button data-c="y" style="background:var(--y)"></button><button data-c="g" style="background:var(--g)"></button><button data-c="b" style="background:var(--b)"></button></div></div>
<div id="over" hidden><div class="box">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Most wins</h3><ol id="board"><li>Loading…</li></ol>
  <button id="again">Play again</button>
</div></div>
<script>
/* ═══ CRAZY CARDS · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Match the color or number. Empty your hand first. Turn-based, 2–6 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ seats, hand size, timers, the leaderboard
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED HANDS .. the Seal helper: hands are encrypted so only their owner can read them
 *   CARDS ......... the deck, what matches, sorting a hand
 *   TABLE (HOST) .. dealing, playing, drawing, the action cards, bots, the turn timer, seats,
 *                   and taking over as a new host. Only the host writes the shared fields.
 *   MY HAND ....... reading my sealed hand, playing a card, drawing, re-sending to a new host
 *   SCREEN ........ seats, the piles, my hand, flying cards, confetti
 *   RESULTS ....... the round-over card and the leaderboard
 *   MAIN LOOP ..... heartbeat, host tick, drawing
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The table lives in shared fields only the HOST writes: `game` (one JSON field: id, v,
 *     phase, seats, counts, turn, dir, top, color, t, drew, turnAt, turnEnds, last, winner,
 *     endsAt), `pile` (the discard pile) and `hand0`…`hand5` (each human's hand, SEALED to
 *     that player's public key, so only they can read it; the host deals, so it can too).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s).
 *     It holds the draw deck and the bots' hands in its own memory.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `pk` (public key), `hb`.
 *   - Players send intents to the host: "play" {g, t, c, color}, "draw" {g, t}, "pass" {g, t},
 *     "again" {g}. `t` counts every action, so an old or double intent is ignored.
 *   - When the host changes, every player re-sends its own hand sealed to the new host
 *     ("myhand" {to, r, box}). The new host rebuilds the deck from the cards nobody holds,
 *     minus the discard pile, reshuffles, and deals the bots fresh hands of the same size.
 *   - Timers are timestamps: turnEnds (then the host plays for you), endsAt (next round).
 *   - ?attract plays offline with bots (and your hand on autopilot) for the preview video.
 *   - Leaderboard "wins": +1 for each round a player wins, shown on the round-over card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,            // bots fill the table up to this many players (2 to 6)
  handSize: 7,         // cards dealt to each player
  turnMs: 20000,       // time to play before the host plays for you
  botMs: 1200,         // how long a bot thinks
  resultsMs: 10000,    // the round-over card shows this long, then the next round deals
  seatGraceMs: 8000,   // a player silent this long hands its seat to a bot
  rejoinMs: 3000,      // a new host waits this long for everyone to re-send their hands
  board: "wins",       // leaderboard name
};
const BOT_NAMES = ["Ace", "Joker", "Dotty", "Wildcard", "Queenie", "Lucky"];
const COLORS = ["#ff8a65", "#4fc3f7", "#ffd54f", "#81c784", "#ba68c8", "#f06292", "#4dd0e1", "#aed581"];
const NAME_A = ["Happy", "Sneaky", "Lucky", "Quick", "Jolly", "Clever"], NAME_B = ["Otter", "Panda", "Fox", "Koala", "Badger", "Moose"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'crazy-cards',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
/** Still in the room and heard from within the seat grace time. */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── SEALED HANDS ────────────────────────────────────────────────────────────────────
// Everything in room state reaches every client, so a hand is written SEALED: encrypted so only
// its one reader can open it. Each player publishes a public key in its own entity (`pk`); the
// host seals each hand to that key and writes the box into shared state.
//   - The host deals, so the host can read every hand. Fine for friends, not cheat-proof.
//   - A new host can't open boxes the old host sealed, so every player re-sends its own hand
//     to the new host (sealed, with mp.send), and the new host rebuilds the deck from those.
//   - crypto.subtle needs https or localhost. Offline you are the host and there is nobody to
//     hide from, so seal()/open() pass the value through.
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on) return "p:" + JSON.stringify(value);
    if (!toPub || !this.pair) return ""; // never plaintext online: nobody can open an empty box
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);
      return JSON.parse(new TextDecoder().decode(pt));
    } catch { return null; }
  },
};

// ── CARDS ───────────────────────────────────────────────────────────────────────────
// A card is two letters: its color (r y g b, or w for wild) and its value
// (0-9, S skip, R reverse, D draw two, W wild, F wild draw four). "r7", "gS", "wF".
const SYMBOL = { S: "⊘", R: "⇄", D: "+2", W: "★", F: "+4" };
const COLOR_NAME = { r: "Red", y: "Yellow", g: "Green", b: "Blue" };
const VALUES = "0123456789SRDWF";
function fullDeck() {
  const d = [];
  for (const c of "rygb") { d.push(c + "0"); for (const v of "123456789SRD") d.push(c + v, c + v); }
  for (let i = 0; i < 4; i++) d.push("wW", "wF");
  return d; // 108 cards
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/** `list` minus one copy of each card in `cards`. */
function without(list, cards) { const out = list.slice(); for (const c of cards) { const i = out.indexOf(c); if (i >= 0) out.splice(i, 1); } return out; }
/** Can this card go on the pile? Same color, same value, or a wild. */
const matches = (card, g) => card[0] === "w" || card[0] === g.color || card[1] === g.top[1];
const sortHand = (h) => h.slice().sort((a, b) => "rygbw".indexOf(a[0]) - "rygbw".indexOf(b[0]) || VALUES.indexOf(a[1]) - VALUES.indexOf(b[1]));

// ── TABLE (HOST) ────────────────────────────────────────────────────────────────────
// The host's private memory: the draw deck, every hand (bots' too), and actions waiting their turn.
const host = { last: null, ready: false, since: 0, busy: false, hands: [], deck: [], pile: [], pileDirty: false, inbox: [], known: new Map() };
const gameMemo = { raw: undefined, g: null };
/** The game as state has it, or the host's own newer write that hasn't come back yet. */
function game() {
  if (gameMemo.raw !== S.shared.game) { gameMemo.raw = S.shared.game; gameMemo.g = parse(S.shared.game, null); }
  const g = gameMemo.g;
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const seatOf = (g, id) => g.seats.findIndex((s) => s.i === id);
const step = (n, dir, from, k) => (((from + dir * k) % n) + n) % n;
const canSit = (id) => net.offline || !Seal.on || (id === net.sessionId ? !!Seal.pub : !!S.entities.players[id]?.pk);
const playerName = (id) => (id === net.sessionId ? myName : S.entities.players[id]?.n || "Player");
const playerColor = (id) => (id === net.sessionId ? myColor : S.entities.players[id]?.c || "#ccc");

/** Seal one human's hand to them and write it to `hand<i>`. Never writes a hand in the clear online. */
async function sealHand(g, i) {
  const s = g.seats[i];
  if (!s || s.b) return;
  const pk = s.i === net.sessionId ? Seal.pub : S.entities.players[s.i]?.pk;
  if (!pk && Seal.on && !net.offline) return;
  net.setShared("hand" + i, JSON.stringify({ id: s.i, r: g.id, by: Seal.pub, box: await Seal.seal(pk, host.hands[i]) }));
}
/** Write an action's result: the changed hands first, then the pile, then the game. */
async function commit(g, sealSeats = []) {
  for (const i of new Set(sealSeats)) await sealHand(g, i);
  if (host.pileDirty) { host.pileDirty = false; net.setShared("pile", JSON.stringify(host.pile)); }
  return writeGame(g);
}
function drawOne() {
  if (!host.deck.length && host.pile.length > 1) { // reshuffle the discard pile, all but its top card
    const top = host.pile.pop();
    host.deck = shuffle(host.pile); host.pile = [top]; host.pileDirty = true;
  }
  return host.deck.pop();
}
function give(i, k) { for (let n = 0; n < k; n++) { const c = drawOne(); if (c) host.hands[i].push(c); } }
const nextTurn = (g, turn, extra = {}) => ({ ...g, turn, t: g.t + 1, drew: 0, turnAt: Date.now(), turnEnds: Date.now() + CONFIG.turnMs, ...extra });

/** A new round: humans first, bots up to CONFIG.seats, a fresh shuffled deck, 7 cards each. */
function deal(prev) {
  const humans = livePlayers().filter(canSit).slice(0, 6);
  const used = new Set(humans.map(playerColor));
  const seats = humans.map((id) => ({ i: id, n: playerName(id), c: playerColor(id) }));
  for (let k = 0; seats.length < Math.max(2, Math.min(6, CONFIG.seats)); k++) {
    const c = COLORS.find((x) => !used.has(x)) || COLORS[k]; used.add(c);
    seats.push({ i: "bot" + k, n: BOT_NAMES[k], c, b: 1 });
  }
  shuffle(seats);
  host.deck = shuffle(fullDeck());
  host.hands = seats.map(() => host.deck.splice(-CONFIG.handSize));
  let top = host.deck.pop();

  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (g) act("again", {}); };
$("deck").onpointerdown = (e) => { e.preventDefault(); const g = game(); if (g && myTurn(g) && !g.drew) act("draw", {}); };
$("keep").onclick = () => { const g = game(); if (g && myTurn(g) && g.drew) act("pass", {}); };
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let myName = "", myColor = COLORS[0], dropped = false, lastHb = 0, last = performance.now();
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
if (!myName) { myName = pickOne(NAME_A) + " " + pickOne(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) { Object.assign(CONFIG, { seats: 5, botMs: 520, turnMs: 4000, resultsMs: 2200, handSize: 6 }); $("net").textContent = ""; }

function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else stopHosting();
  const g = game();
  if (g) {
    readMyHand(g);
    resendHand(g, now);
    drawSeats(g, now); drawPiles(g); drawHand(g); status(g); effects(g); results(g); autopilot(g);
  }
  drawFx(dt);
  requestAnimationFrame(frame);
}

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again.
 *  The bots' colors at the table count as taken too. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), botColors = (game()?.seats || []).filter((s) => s.b).map((s) => s.c);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["play", "draw", "pass", "again"]) net.on(type, (data, from) => { if (isHost() && data) host.inbox.push({ type, from, data }); });
  net.on("myhand", (d, from) => { // a player re-sending its hand to me, the new host
    const g = game(), i = g && d ? seatOf(g, from) : -1;
    if (i < 0 || d.to !== net.sessionId || d.r !== g.id || host.ready) return;
    Seal.open(S.entities.players[from]?.pk, d.box).then((cards) => { if (Array.isArray(cards)) host.known.set(i, cards); });
  });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(game()?.seats || []).filter((s) => s.b).map((s) => s.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || pickOne(COLORS);
  const pk = await Seal.init().catch(() => "");
  net.me.set({ n: myName, c: myColor, pk, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
